name: Build Vivify Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QPM
        run: |
          # 1. Get the URL for the latest release of QPM.CLI
          # 2. Filter for the linux binary specifically
          # 3. Download it dynamically
          URL=$(curl -s https://api.github.com/repos/QuestPackageManager/QPM.CLI/releases/latest | \
                grep "browser_download_url" | grep "qpm-linux-x64" | head -n 1 | cut -d '"' -f 4)
          
          echo "Found latest QPM binary at: $URL"
          wget -q "$URL" -O qpm
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm
          qpm --version

      - name: QPM Restore
        env:
          QPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          qpm collect
          qpm restore

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Project
        run: |
          cmake -S . -B build -DANDROID_ABI=arm64-v8a
          cmake --build build
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivify-Mod
          path: |
            build/*.qmod
            build/*.so
          
