name: Build Vivify Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install QPM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use GitHub CLI to get the latest release asset URL
          # This avoids hardcoding version numbers or broken URLs
          gh release download --repo QuestPackageManager/QPM.CLI --pattern "qpm-linux-x64" --output qpm
          chmod +x qpm
          sudo mv qpm /usr/local/bin/qpm
          qpm --version

      - name: QPM Restore
        env:
          QPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          qpm collect
          qpm restore

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Project
        run: |
          cmake -S . -B build -DANDROID_ABI=arm64-v8a
          cmake --build build
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivify-Mod
          path: |
            build/*.qmod
            build/*.so
