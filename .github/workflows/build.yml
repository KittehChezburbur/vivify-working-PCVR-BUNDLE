name: Build Vivify Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install QPM
        run: |
          # Install the tool via the official NuGet feed
          dotnet tool install --global QPM.CLI
          # Add the .dotnet/tools folder to the path
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: QPM Restore
        env:
          QPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          qpm collect
          qpm restore

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Project
        run: |
          cmake -S . -B build -DANDROID_ABI=arm64-v8a
          cmake --build build
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivify-Mod
          path: |
            build/*.qmod
            build/*.so
